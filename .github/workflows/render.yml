name: Render profile
on:
  push:
    branches: [main]
    paths: [profile.json, render.mjs, package.json, package-lock.json, .github/workflows/render.yml]
  schedule:
    - cron: '17 6 * * *'   # daily, right after the Incident Register's 06:00 UTC run
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: render, cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node render.mjs
      - name: Publish SVGs to the output branch
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "render $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
      - name: Commit README if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Render README" && git push)
